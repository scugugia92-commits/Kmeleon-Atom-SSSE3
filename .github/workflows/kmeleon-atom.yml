name: K-Meleon Atom Z520 SSSE3

on:
  workflow_dispatch:

jobs:
  compila-goanna:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

      - name: Scarica sorgenti Goanna
        uses: actions/checkout@v4
        with:
          repository: roytam1/palemoon27
          ref: kmeleon76
          path: goanna

      - name: Scarica sorgenti K-Meleon
        uses: actions/checkout@v4
        with:
          repository: roytam1/kmeleon
          path: kmeleon

      - name: Attiva compilatore Microsoft x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Installa Python 2.7
        shell: pwsh
        run: |
          choco install python2 --version=2.7.18 -y --no-progress

          if (!(Test-Path "C:\Python27\python.exe")) {
            throw "Python 2.7 non trovato"
          }

          & "C:\Python27\python.exe" --version

      - name: Installa MSYS2 e Autoconf 2.13
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          path-type: inherit
          install: >-
            autoconf2.13
            autoconf-wrapper
            make
            m4
            perl
            patch
            diffutils
            zip
            unzip

      - name: Individua compilatore e linker Microsoft
        shell: pwsh
        run: |
          Write-Host "VERIFICA TOOLCHAIN MICROSOFT"

          $compiler = (Get-Command cl.exe).Source

          $compilerDir = Split-Path $compiler

          $linker = Join-Path $compilerDir "link.exe"

          if (!(Test-Path $compiler)) {
            throw "Compilatore Microsoft non trovato"
          }

          if (!(Test-Path $linker)) {
            throw "Linker Microsoft non trovato"
          }

          Write-Host "COMPILATORE:"
          Write-Host $compiler

          Write-Host "LINKER:"
          Write-Host $linker

          Write-Host "VERSIONE LINKER:"
          & $linker /?

          Write-Host "VERSIONE COMPILATORE:"
          & $compiler /?

          $compilerUnix = $compiler.Replace("\", "/")
          $linkerUnix = $linker.Replace("\", "/")

          "MSVC_CC=$compilerUnix" |
            Out-File $env:GITHUB_ENV -Append

          "MSVC_LD=$linkerUnix" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Toolchain individuata"

      - name: Verifica ottimizzazioni Intel Atom
        shell: cmd
        run: |
          echo ======================================
          echo INTEL ATOM Z520
          echo ARCHITETTURA BONNELL
          echo WINDOWS 7 32 BIT
          echo ======================================

          where cl
          where link
          where clang

          echo int main(void) { return 0; } > atom.cpp

          cl /nologo /O2 /arch:SSE2 /favor:ATOM /c atom.cpp

          if not exist atom.obj exit /b 1

          echo TEST MICROSOFT ATOM SUPERATO

      - name: Verifica Clang Bonnell SSSE3
        shell: pwsh
        run: |
          Write-Host "VERIFICA CLANG BONNELL SSSE3"

          Set-Content atom-test.c `
            "int main(void) { return 0; }"

          clang `
            -target i686-pc-windows-msvc `
            -march=bonnell `
            -mtune=bonnell `
            -mssse3 `
            -O2 `
            -c atom-test.c `
            -o atom-test.obj

          if (!(Test-Path atom-test.obj)) {
            throw "Test Bonnell SSSE3 fallito"
          }

          Write-Host "TEST BONNELL SSSE3 SUPERATO"

      - name: Prepara configurazione Goanna Atom Z520
        shell: pwsh
        run: |
          $config = @"
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-atom-z520
          mk_add_options MOZ_MAKE_FLAGS="-j4"

          ac_add_options --enable-application=xulrunner

          ac_add_options --build=i686-pc-mingw32
          ac_add_options --host=i686-pc-mingw32
          ac_add_options --target=i686-pc-mingw32

          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-updater

          ac_add_options --enable-optimize="/O2 /arch:SSE2 /favor:ATOM"

          export CC="$env:MSVC_CC"
          export CXX="$env:MSVC_CC"
          export LD="$env:MSVC_LD"
          "@

          Set-Content `
            -Path goanna/.mozconfig `
            -Value $config `
            -Encoding ASCII

          Write-Host "CONFIGURAZIONE GOANNA:"
          Get-Content goanna/.mozconfig

      - name: Verifica linker ambiente MSYS2
        shell: msys2 {0}
        run: |
          echo "===================================="
          echo "CONTROLLO LINKER MSYS2"
          echo "===================================="

          echo "LINKER NEL PATH:"
          which link || true

          echo "COMPILATORE NEL PATH:"
          which cl || true

          echo "LINKER MICROSOFT SELEZIONATO:"
          echo "$MSVC_LD"

          if [ ! -f "$MSVC_LD" ]; then
            echo "ERRORE: linker Microsoft non trovato"
            exit 1
          fi

          echo "VERSIONE LINKER MICROSOFT:"

          "$MSVC_LD" -v 2>&1 || true

          echo "CONTROLLO COMPLETATO"

      - name: Compila motore Goanna
        shell: msys2 {0}
        run: |
          echo "===================================="
          echo "K-MELEON 76 GOANNA"
          echo "INTEL ATOM Z520"
          echo "BONNELL SSSE3"
          echo "WINDOWS 7 32 BIT"
          echo "===================================="

          export PATH="/c/Python27:/c/Python27/Scripts:$PATH"

          export PYTHON="C:/Python27/python.exe"
          export MOZ_PYTHON="C:/Python27/python.exe"

          export WANT_AUTOCONF=2.13
          export CONFIG_SITE=/dev/null

          export CC="$MSVC_CC"
          export CXX="$MSVC_CC"
          export LD="$MSVC_LD"

          echo "PYTHON:"
          python --version

          echo "AUTOCONF:"
          autoconf-2.13 --version

          echo "COMPILATORE:"
          echo "$CC"

          echo "LINKER:"
          echo "$LD"

          echo "AVVIO COMPILAZIONE GOANNA"

          cd goanna

          set +e

          python mach build > ../goanna-build.log 2>&1

          RESULT=$?

          set -e

          cat ../goanna-build.log

          exit $RESULT

      - name: Mostra errori compilazione
        if: always()
        shell: pwsh
        run: |
          if (Test-Path goanna-build.log) {

            Write-Host "ULTIME 200 RIGHE COMPILAZIONE"

            Get-Content goanna-build.log -Tail 200

          }
          else {

            Write-Host "REGISTRO COMPILAZIONE NON PRESENTE"

          }

      - name: Salva registro compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kmeleon-Atom-Z520-Build-Log
          path: |
            goanna-build.log
            goanna/.mozconfig
            goanna/obj-atom-z520/config.log
          if-no-files-found: warn

      - name: Salva motore Goanna compilato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goanna-Atom-Z520
          path: goanna/obj-atom-z520/dist/bin/
          if-no-files-found: warn
