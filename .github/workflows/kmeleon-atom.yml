name: K-Meleon Atom Z520 SSSE3

on:
  workflow_dispatch:

jobs:
  verifica-compilatore:
    runs-on: windows-2022

    steps:
      - name: Scarica motore Goanna
        uses: actions/checkout@v4
        with:
          repository: roytam1/palemoon27
          ref: kmeleon76
          path: goanna

      - name: Scarica K-Meleon
        uses: actions/checkout@v4
        with:
          repository: roytam1/kmeleon
          path: kmeleon

      - name: Attiva compilatore Microsoft x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Verifica compilatori
        shell: cmd
        run: |
          echo ===========================
          echo INTEL ATOM Z520
          echo WINDOWS 7 32 BIT
          echo ===========================

          where cl
          where link
          where msbuild
          where clang

          cl /Bv

      - name: Verifica supporto ottimizzazioni Atom
        shell: pwsh
        run: |
          Write-Host "TARGET: Intel Atom Z520"
          Write-Host "ARCHITETTURA: Bonnell"
          Write-Host "ISTRUZIONI: SSE2 SSE3 SSSE3"
          Write-Host "SISTEMA: Windows 7 x86"

          clang --version

          clang -target i686-pc-windows-msvc -march=bonnell -### -c -x c NUL 2>&1 | Out-String | Write-Host

      - name: Verifica struttura sorgenti
        shell: pwsh
        run: |
          Write-Host "Sorgenti Goanna:"
          Get-ChildItem goanna -Name | Select-Object -First 20

          Write-Host "Sorgenti K-Meleon:"
          Get-ChildItem kmeleon -Name | Select-Object -First 20
