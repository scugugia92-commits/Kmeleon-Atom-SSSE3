name: K-Meleon Atom Z520 SSSE3

on:
  workflow_dispatch:

jobs:
  compila-goanna:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

      - name: Scarica sorgenti Goanna
        uses: actions/checkout@v4
        with:
          repository: roytam1/palemoon27
          ref: kmeleon76
          path: goanna

      - name: Scarica sorgenti K-Meleon
        uses: actions/checkout@v4
        with:
          repository: roytam1/kmeleon
          path: kmeleon

      - name: Attiva compilatore Microsoft x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Installa Python 2.7
        shell: pwsh
        run: |
          choco install python2 --version=2.7.18 -y --no-progress

          if (!(Test-Path "C:\Python27\python.exe")) {
            throw "Python 2.7 non trovato"
          }

          & "C:\Python27\python.exe" --version

      - name: Installa MSYS2 e Autoconf 2.13
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          path-type: inherit
          install: >-
            autoconf2.13
            autoconf-wrapper
            make
            m4
            perl
            patch
            diffutils
            zip
            unzip

      - name: Individua toolchain Microsoft
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe).Source

          $directory = Split-Path $compiler

          $linker = Join-Path $directory "link.exe"

          if (!(Test-Path $compiler)) {
            throw "Compilatore Microsoft non trovato"
          }

          if (!(Test-Path $linker)) {
            throw "Linker Microsoft non trovato"
          }

          Write-Host "COMPILATORE:"
          Write-Host $compiler

          Write-Host "LINKER:"
          Write-Host $linker

          $compilerUnix = $compiler.Replace("\", "/")
          $linkerUnix = $linker.Replace("\", "/")

          "MSVC_CC=$compilerUnix" |
            Out-File $env:GITHUB_ENV -Append

          "MSVC_LD=$linkerUnix" |
            Out-File $env:GITHUB_ENV -Append

      - name: Verifica compilazione Windows Atom
        shell: cmd
        run: |
          echo ======================================
          echo INTEL ATOM Z520
          echo WINDOWS 7 32 BIT
          echo ======================================

          echo int main(void) { return 0; } > atom.cpp

          cl /nologo /O2 /arch:SSE2 /favor:ATOM atom.cpp /Fe:atom.exe

          if not exist atom.exe exit /b 1

          echo COMPILAZIONE E LINK MICROSOFT RIUSCITI

      - name: Prepara configurazione Goanna
        shell: pwsh
        run: |
          $config = @'
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-atom-z520
          mk_add_options MOZ_MAKE_FLAGS="-j4"

          ac_add_options --enable-application=xulrunner

          ac_add_options --build=i686-pc-mingw32
          ac_add_options --host=i686-pc-mingw32
          ac_add_options --target=i686-pc-mingw32

          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-updater

          ac_add_options --enable-optimize="/O2 /arch:SSE2 /favor:ATOM"
          '@

          Set-Content `
            -Path goanna/.mozconfig `
            -Value $config `
            -Encoding ASCII

          Get-Content goanna/.mozconfig

      - name: Verifica compilatore dentro MSYS2
        shell: msys2 {0}
        run: |
          echo "======================================"
          echo "VERIFICA TOOLCHAIN MSYS2"
          echo "======================================"

          export PATH="/c/Python27:/c/Python27/Scripts:$PATH"

          export CC="$MSVC_CC"
          export CXX="$MSVC_CC"
          export LD="$MSVC_LD"

          echo "COMPILATORE:"
          echo "$CC"

          echo "LINKER:"
          echo "$LD"

          echo "PYTHON:"
          python --version

          echo "AUTOCONF:"
          autoconf-2.13 --version

          echo "VERIFICA COMPILAZIONE"

          printf 'int main(void) {return 0;}\n' > test-msys.c

          "$CC" -nologo -c test-msys.c -Fotest-msys.obj

          echo "VERIFICA LINKER"

          "$LD" -NOLOGO -OUT:test-msys.exe test-msys.obj

          if [ ! -f test-msys.exe ]; then
            echo "ERRORE: impossibile creare eseguibile"
            exit 1
          fi

          echo "TEST MSYS2 COMPLETATO"

      - name: Compila motore Goanna
        shell: msys2 {0}
        run: |
          echo "======================================"
          echo "K-MELEON 76 GOANNA"
          echo "INTEL ATOM Z520"
          echo "WINDOWS 7 32 BIT"
          echo "======================================"

          export PATH="/c/Python27:/c/Python27/Scripts:$PATH"

          export PYTHON="C:/Python27/python.exe"
          export MOZ_PYTHON="C:/Python27/python.exe"

          export WANT_AUTOCONF=2.13
          export CONFIG_SITE=/dev/null

          export CC="$MSVC_CC"
          export CXX="$MSVC_CC"
          export LD="$MSVC_LD"

          echo "COMPILATORE:"
          echo "$CC"

          echo "LINKER:"
          echo "$LD"

          echo "AVVIO COMPILAZIONE GOANNA"

          cd goanna

          set +e

          python mach build > ../goanna-build.log 2>&1

          RESULT=$?

          set -e

          cat ../goanna-build.log

          exit $RESULT

      - name: Analizza errori configurazione
        if: always()
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "DIAGNOSTICA GOANNA"
          Write-Host "======================================"

          if (Test-Path goanna-build.log) {
            Write-Host "ULTIME 120 RIGHE BUILD"
            Get-Content goanna-build.log -Tail 120
          }

          $logs = Get-ChildItem goanna `
            -Filter config.log `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($logs) {
            foreach ($log in $logs) {
              Write-Host "================================"
              Write-Host "CONFIG LOG:"
              Write-Host $log.FullName
              Write-Host "================================"

              Get-Content $log.FullName -Tail 180
            }
          }
          else {
            Write-Host "Nessun config.log trovato"
          }

      - name: Salva diagnostica completa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kmeleon-Z520-Diagnostica
          path: |
            goanna-build.log
            goanna/.mozconfig
            goanna/**/config.log
          if-no-files-found: warn

      - name: Verifica risultato compilazione
        if: success()
        shell: pwsh
        run: |
          $bin = "goanna/obj-atom-z520/dist/bin"

          if (!(Test-Path $bin)) {
            throw "La cartella del motore compilato non esiste"
          }

          Get-ChildItem $bin -Recurse |
            Select-Object -First 50

      - name: Salva motore Goanna compilato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goanna-Atom-Z520
          path: goanna/obj-atom-z520/dist/bin/
          if-no-files-found: error
