name: K-Meleon Atom Z520 SSSE3

on:
  workflow_dispatch:

jobs:
  compila-goanna:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

      - name: Scarica sorgenti Goanna
        uses: actions/checkout@v4
        with:
          repository: roytam1/palemoon27
          ref: kmeleon76
          path: goanna

      - name: Scarica sorgenti K-Meleon
        uses: actions/checkout@v4
        with:
          repository: roytam1/kmeleon
          path: kmeleon

      - name: Attiva compilatore Windows x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Installa Python 2.7
        shell: pwsh
        run: |
          choco install python2 --version=2.7.18 -y --no-progress

          if (!(Test-Path "C:\Python27\python.exe")) {
            throw "Python 2.7 non trovato"
          }

          & "C:\Python27\python.exe" --version

      - name: Prepara configurazione Atom
        shell: pwsh
        run: |
          $config = @'
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-atom-z520
          mk_add_options MOZ_MAKE_FLAGS="-j4"

          ac_add_options --enable-application=xulrunner
          ac_add_options --target=i686-pc-mingw32

          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-updater

          ac_add_options --enable-optimize="/O2 /arch:SSE2 /favor:ATOM"
          '@

          Set-Content -Path goanna/.mozconfig `
            -Value $config -Encoding ASCII

          Get-Content goanna/.mozconfig

      - name: Verifica toolchain
        shell: cmd
        run: |
          where cl
          where link
          where clang
          where make

          echo int main(void) { return 0; } > atom.cpp

          cl /nologo /O2 /arch:SSE2 /favor:ATOM /c atom.cpp

          if not exist atom.obj exit /b 1

            - name: Tenta compilazione motore Goanna
        shell: cmd
        run: |
          echo ======================================
          echo K-MELEON GOANNA ATOM Z520 SSSE3
          echo ======================================

          set "PATH=C:\Python27;C:\Python27\Scripts;%PATH%"
          set "PYTHON=C:\Python27\python.exe"
          set "MOZ_PYTHON=C:\Python27\python.exe"

          echo VERIFICA PYTHON

          where python
          python --version

          echo AVVIO COMPILAZIONE GOANNA

          cd goanna

          python mach build > ..\goanna-build.log 2>&1

          set RESULT=%ERRORLEVEL%

          type ..\goanna-build.log

          exit /b %RESULT%

      - name: Mostra errori compilazione
        if: always()
        shell: pwsh
        run: |
          if (Test-Path goanna-build.log) {
            Write-Host "ULTIME 150 RIGHE DELLA COMPILAZIONE"
            Get-Content goanna-build.log -Tail 150
          }
          else {
            Write-Host "Compilazione non avviata"
          }

      - name: Salva rapporto compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kmeleon-Atom-Z520-Build-Log
          path: |
            goanna-build.log
            goanna/.mozconfig
          if-no-files-found: warn

      - name: Salva motore compilato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Goanna-Atom-Z520
          path: goanna/obj-atom-z520/dist/bin/
          if-no-files-found: warn
